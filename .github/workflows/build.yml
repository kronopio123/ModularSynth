name: Build Modular Synth

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_path: build/ModularSynth_artefacts/Release/Standalone/Modular Synth.exe
          - os: macos-latest
            artifact_path: build/ModularSynth_artefacts/Release/Standalone/Modular Synth.app
          - os: ubuntu-latest
            artifact_path: build/ModularSynth_artefacts/Release/Standalone/Modular Synth

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio/GUI dev deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModularSynth-${{ runner.os }}
          path: ${{ matrix.artifact_path }}
